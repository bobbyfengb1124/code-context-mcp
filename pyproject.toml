[project]
name = "ccctx"
version = "0.1.0"
description = "Code context brain for AI coding tools, served over MCP"
requires-python = ">=3.13"
dependencies = [
    # 0.26.0 segfaults (access violation in Node.named_children) on Windows; recheck before lifting
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.25.0",
    "typer>=0.15",
]

[project.scripts]
ccctx = "ccctx.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"
