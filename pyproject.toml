[project]
name = "ccctx"
version = "0.1.0"
description = "Code context brain for AI coding tools, served over MCP"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
ccctx = "ccctx.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"
